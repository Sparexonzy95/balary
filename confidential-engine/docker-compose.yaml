services:
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "${REDIS_BIND:-127.0.0.1:6382}:6379"
    tmpfs:
      - /data

  ext-proxy:
    image: ${REGISTRY:-local}/tee-proxy
    volumes:
      - ./config/proxy/extension_proxy.docker.toml:/app/config/config.toml:ro
    environment:
      - PROXY_PRIVATE_KEY=${PROXY_PRIVATE_KEY:?PROXY_PRIVATE_KEY is required}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${EXT_PROXY_INTERNAL_BIND:-0.0.0.0:6673}:6663"
      - "${EXT_PROXY_EXTERNAL_BIND:-0.0.0.0:6674}:6664"
    depends_on:
      - redis

  extension-tee:
    build:
      context: .
      # Selected by LANGUAGE in .env; start-services.sh resolves <LANGUAGE>/Dockerfile
      # by directory convention. Adding a language needs no change here.
      dockerfile: ${EXTENSION_DOCKERFILE:-go/Dockerfile}
      args:
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}
        # Consumed by language images that build tee-node from source. A Go
        # pseudo-version pin is a commit SHA, not a tag â€” see scripts/lib/versions.sh.
        TEE_NODE_REF: ${TEE_NODE_REF:-}
    env_file:
      - path: ./config/extension.env
        required: false
    environment:
      - MODE=${MODE:-1}
      # Chain id the node binds signatures to â€” must match the proxy's chain_id
      # and the chain itself. Local e2e Hardhat = 31337; the coston/coston2
      # overrides set 16/114 for those networks.
      - CHAIN_ID=${CHAIN_ID:-114}
      - INITIAL_OWNER=${INITIAL_OWNER:-0xF4E021377420Afe90c1A7D2b8968904946633a64}
      # TEE governance the node signs with. Must match what set-governance
      # registers on-chain (post-build reads the same vars). Defaults to the
      # deployer (INITIAL_OWNER) as sole signer, threshold 1; override in .env.
      - GOVERNANCE_SIGNERS=${GOVERNANCE_SIGNERS:-${INITIAL_OWNER:-0xF4E021377420Afe90c1A7D2b8968904946633a64}}
      - GOVERNANCE_THRESHOLD=${GOVERNANCE_THRESHOLD:-1}
      - PROXY_URL=http://ext-proxy:6663
      - CONFIG_PORT=5501
      - SIGN_PORT=7701
      - EXTENSION_PORT=7702
      # Deployment bindings have no defaults. These explicit pass-throughs
      # override any superseded values retained in the archived env file.
      - COSTON2_RPC_URL=${COSTON2_RPC_URL:?COSTON2_RPC_URL is required}
      - ZALARY_GATEWAY_ADDRESS=${ZALARY_GATEWAY_ADDRESS:?ZALARY_GATEWAY_ADDRESS is required}
      - ZALARY_VAULT_ADDRESS=${ZALARY_VAULT_ADDRESS:?ZALARY_VAULT_ADDRESS is required}
      - FCE_EXTENSION_ID=${FCE_EXTENSION_ID:?FCE_EXTENSION_ID is required}
      - STABLECOIN_ADDRESS=${STABLECOIN_ADDRESS:?STABLECOIN_ADDRESS is required}
      - ZALARY_STATE_KEY=${ZALARY_STATE_KEY:?ZALARY_STATE_KEY is required}
      - ZALARY_STATE_PATH=${ZALARY_STATE_PATH:-/var/lib/zalary/ledger.snapshot}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SIMULATED_TEE=${SIMULATED_TEE:-true}
    volumes:
      - zalary-private-state:/var/lib/zalary
    depends_on:
      - ext-proxy

volumes:
  zalary-private-state:


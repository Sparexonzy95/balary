<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }}</title></head>
<body style="margin:0;background:#f6f7f9;font-family:Arial,sans-serif;color:#15171a">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f6f7f9;padding:24px 12px">
    <tr><td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px;background:#fff;border-radius:14px;overflow:hidden;border:1px solid #e8eaed">
        <tr><td style="padding:28px 32px;background:#111;color:#fff;font-size:22px;font-weight:700">Zalary</td></tr>
        <tr><td style="padding:32px">
          <h1 style="margin:0 0 16px;font-size:24px;line-height:1.3">{{ title }}</h1>
          <p style="margin:0 0 20px;font-size:16px;line-height:1.6">{{ message }}</p>
          {% block details %}{% endblock %}
          <p style="margin:28px 0 0"><a href="{{ app_url|default:'http://localhost:5173' }}" style="display:inline-block;background:#111;color:#fff;text-decoration:none;padding:12px 18px;border-radius:8px">Open Zalary</a></p>
        </td></tr>
        <tr><td style="padding:20px 32px;background:#fafafa;color:#666;font-size:12px;line-height:1.5">Automated operational message from Zalary Confidential Payroll. Never share your wallet private key or recovery phrase.</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>

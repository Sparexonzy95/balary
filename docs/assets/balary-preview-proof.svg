<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">Balary Preview lifecycle evidence</title><desc id="desc">100 public USDM, deposit 10, mint 10 zUSDM, fund and claim 5, redeem 5, ending with 95 public USDM and 5 backed zUSDM.</desc><rect width="1200" height="300" rx="22" fill="#091022"/><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><text x="600" y="42" fill="#f5f7ff" font-size="24" font-weight="700">MIDNIGHT PREVIEW ? PROVEN LIFECYCLE</text><g fill="#142247" stroke="#7183eb"><rect x="25" y="82" width="170" height="80" rx="12"/><rect x="220" y="82" width="170" height="80" rx="12"/><rect x="415" y="82" width="170" height="80" rx="12"/><rect x="610" y="82" width="170" height="80" rx="12"/><rect x="805" y="82" width="170" height="80" rx="12"/><rect x="1000" y="82" width="175" height="80" rx="12"/></g><g fill="#f2f4ff" font-size="15" font-weight="700"><text x="110" y="115">100 USDM</text><text x="305" y="115">DEPOSIT 10</text><text x="500" y="115">MINT 10 zUSDM</text><text x="695" y="115">FUND 5</text><text x="890" y="115">CLAIM 5</text><text x="1087" y="115">REDEEM 5</text></g><g fill="#aeb9df" font-size="12"><text x="110" y="141">public start</text><text x="305" y="141">to Gateway</text><text x="500" y="141">shielded</text><text x="695" y="141">ACTIVE</text><text x="890" y="141">COMPLETED</text><text x="1087" y="141">to public USDM</text></g><rect x="170" y="205" width="860" height="62" rx="14" fill="#10383a" stroke="#67d9b8"/><text x="600" y="230" fill="#dffff6" font-size="17" font-weight="700">FINAL: 95 PUBLIC USDM ? 5 zUSDM OUTSTANDING ? 5 USDM LOCKED</text><text x="600" y="254" fill="#8fe5cd" font-size="15">Locked USDM = Outstanding redeemable zUSDM</text></g></svg>
